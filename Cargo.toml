[package]
name = "vlccraft"
version = "1.0.0"
edition = "2021"
description = "VLCCraft — a calm skin over the VLC you already have"
license = "MIT"
repository = "https://github.com/mjb73/vlccraft"
readme = "README.md"

[dependencies]
eframe = "0.33.3"
egui = "0.33.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.8"
ureq = "2.12"

# Only needed on macOS, where the screenshot run must not steal activation.
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 2
