name: mac runners probe

on:
  push:
    branches: [probe/mac-runners]
  workflow_dispatch:

jobs:
  probe:
    name: probe (${{ matrix.label }})
    runs-on: ${{ matrix.label }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        label: [macos-13, macos-14, macos-15, macos-15-intel]
    steps:
      - name: Say hello
        run: uname -a && sw_vers
